name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Chrome / Edge / Safari-source packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip

  safari-app:
    name: Safari macOS app (unsigned, best effort)
    runs-on: macos-latest
    continue-on-error: true
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Convert with safari-web-extension-converter
        run: ./safari/build-safari.sh --no-open
      - name: Build unsigned app with xcodebuild
        run: |
          set -euo pipefail
          PROJ=$(find safari/build -maxdepth 2 -name '*.xcodeproj' | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath safari/build/DerivedData build
          APP=$(find safari/build/DerivedData -maxdepth 6 -name '*.app' -path '*Release*' | head -1)
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/jira-weekend-marker-${{ needs.build.outputs.version }}-safari-macos-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: safari-app
          path: dist/*.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, safari-app]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract release notes for this version
        run: |
          V="${{ needs.build.outputs.version }}"
          awk -v v="$V" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ") || index($0, " " v "$")) found=1 }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || cp RELEASE_NOTES.md notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          body_path: notes.md
          files: artifacts/*.zip
